# Slug must match MQTT node. Clock: now() only updates when something
# else in this block changes, so add time_date (sensor.time) for a live clock.

openhasp:
  tpanel:
    objects:
      - obj: "p1b10"
        properties:
          "text": "{% set d = ['ma','ti','ke','to','pe','la','su'] %}{{ d[now().weekday()] }} {{ now().day }}.{{ now().month }}."
      - obj: "p1b11"
        properties:
          "text": "{{ now().strftime('%H:%M') }}"
      - obj: "p1b12"
        properties:
          "text": "{{ state_translated('weather.lansi_herttoniemi') }}"
      - obj: "p1b22"
        properties:
          "text": "{{ states('sensor.temperature_4') | float(0) | round(1) }}°"
      - obj: "p1b32"
        properties:
          "text": "{{ state_attr('weather.lansi_herttoniemi', 'temperature') | float(0) | round(0) }}°"
      - obj: "p1b42"
        properties:
          "text": >-
            {% set m = states('sensor.majavatie_h4056_next_departure') %}
            {{ '--' if m in ['unknown', 'unavailable', 'none', ''] else m ~ ' min' }}
      - obj: "p1b43"
        properties:
          "val": "{{ states('sensor.majavatie_h4056_next_departure') | float(0) | round(0) }}"

