# Slug must match MQTT node. Uncomment and point at your entities later.
# Clock: now() only updates when something else in this block changes,
# so add time_date (sensor.time) if you want a live clock.

openhasp:
  tpanel:
    objects:
      - obj: "p1b10"   # date
        properties:
          "text": "{{ now().strftime('%-d.%-m.') }}"
      - obj: "p1b11"   # time
        properties:
          "text": "{{ now().strftime('%H:%M') }}"
      # - obj: "p1b12"  # subtitle, e.g. weather
      #   properties:
